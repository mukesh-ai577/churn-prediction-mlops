<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='/style.css') }}">
</head>

<body>
    <main class="container">
        <header class="page-header">
            <span class="eyebrow">MACHINE LEARNING PROJECT</span>
            <h1>Customer Churn Prediction</h1>
            <p>Enter customer details to estimate the likelihood of churn.</p>
        </header>

        <form id="predictionForm">
            <section class="form-section">
                <h2>Customer Information</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select gender</option>
                            <option>Female</option>
                            <option>Male</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="SeniorCitizen">Senior Citizen</label>
                        <select id="SeniorCitizen" name="SeniorCitizen" required>
                            <option value="">Select</option>
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="Partner">Partner</label>
                        <select id="Partner" name="Partner" required>
                            <option value="">Select</option>
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="Dependents">Dependents</label>
                        <select id="Dependents" name="Dependents" required>
                            <option value="">Select</option>
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="tenure">Tenure (months)</label>
                        <input id="tenure" name="tenure" type="number"
                               min="0" max="1000" required
                               placeholder="e.g. 12">
                    </div>

                    <div class="form-group">
                        <label for="Contract">Contract</label>
                        <select id="Contract" name="Contract" required>
                            <option value="">Select contract</option>
                            <option>Month-to-month</option>
                            <option>One year</option>
                            <option>Two year</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2>Services</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="PhoneService">Phone Service</label>
                        <select id="PhoneService" name="PhoneService" required>
                            <option value="">Select</option>
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="MultipleLines">Multiple Lines</label>
                        <select id="MultipleLines" name="MultipleLines" required>
                            <option value="">Select</option>
                            <option>Yes</option>
                            <option>No</option>
                            <option>No phone service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="InternetService">Internet Service</label>
                        <select id="InternetService" name="InternetService" required>
                            <option value="">Select</option>
                            <option>DSL</option>
                            <option>Fiber optic</option>
                            <option>No</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="OnlineSecurity">Online Security</label>
                        <select id="OnlineSecurity" name="OnlineSecurity" required>
                            <option value="">Select</option>
                            <option>Yes</option>
                            <option>No</option>
                            <option>No internet service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="OnlineBackup">Online Backup</label>
                        <select id="OnlineBackup" name="OnlineBackup" required>
                            <option value="">Select</option>
                            <option>Yes</option>
                            <option>No</option>
                            <option>No internet service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="DeviceProtection">Device Protection</label>
                        <select id="DeviceProtection" name="DeviceProtection" required>
                            <option value="">Select</option>
                            <option>Yes</option>
                            <option>No</option>
                            <option>No internet service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="TechSupport">Tech Support</label>
                        <select id="TechSupport" name="TechSupport" required>
                            <option value="">Select</option>
                            <option>Yes</option>
                            <option>No</option>
                            <option>No internet service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="StreamingTV">Streaming TV</label>
                        <select id="StreamingTV" name="StreamingTV" required>
                            <option value="">Select</option>
                            <option>Yes</option>
                            <option>No</option>
                            <option>No internet service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="StreamingMovies">Streaming Movies</label>
                        <select id="StreamingMovies" name="StreamingMovies" required>
                            <option value="">Select</option>
                            <option>Yes</option>
                            <option>No</option>
                            <option>No internet service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="PaperlessBilling">Paperless Billing</label>
                        <select id="PaperlessBilling" name="PaperlessBilling" required>
                            <option value="">Select</option>
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="PaymentMethod">Payment Method</label>
                        <select id="PaymentMethod" name="PaymentMethod" required>
                            <option value="">Select payment method</option>
                            <option>Electronic check</option>
                            <option>Mailed check</option>
                            <option>Bank transfer (automatic)</option>
                            <option>Credit card (automatic)</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2>Billing Information</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="MonthlyCharges">Monthly Charges</label>
                        <input id="MonthlyCharges" name="MonthlyCharges"
                               type="number" min="0" step="0.01"
                               required placeholder="e.g. 70.50">
                    </div>

                    <div class="form-group">
                        <label for="TotalCharges">Total Charges</label>
                        <input id="TotalCharges" name="TotalCharges"
                               type="number" min="0" step="0.01"
                               required placeholder="e.g. 850.50">
                    </div>
                </div>
            </section>

            <button id="submitButton" type="submit">
                Predict Churn
            </button>
        </form>

        <div id="errorMessage" class="error-message" role="alert"></div>

        <section id="result" class="result-card" aria-live="polite" hidden>
            <span class="result-label">PREDICTION RESULT</span>
            <h2 id="predictionText"></h2>
            <p class="probability">
                Churn Probability: <strong id="probabilityText"></strong>
            </p>
            <p id="answerText" class="answer-text"></p>
            <p class="result-note">
                This is a model prediction, not a guarantee of customer behavior.
            </p>
        </section>
    </main>

    <script>
        const form = document.getElementById("predictionForm");
        const button = document.getElementById("submitButton");
        const resultBox = document.getElementById("result");
        const errorBox = document.getElementById("errorMessage");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            resultBox.hidden = true;
            errorBox.textContent = "";
            button.disabled = true;
            button.textContent = "Predicting...";

            const formData = new FormData(form);

            const data = {
                gender: formData.get("gender"),
                SeniorCitizen: Number(formData.get("SeniorCitizen")),
                Partner: formData.get("Partner"),
                Dependents: formData.get("Dependents"),
                tenure: Number(formData.get("tenure")),
                PhoneService: formData.get("PhoneService"),
                MultipleLines: formData.get("MultipleLines"),
                InternetService: formData.get("InternetService"),
                OnlineSecurity: formData.get("OnlineSecurity"),
                OnlineBackup: formData.get("OnlineBackup"),
                DeviceProtection: formData.get("DeviceProtection"),
                TechSupport: formData.get("TechSupport"),
                StreamingTV: formData.get("StreamingTV"),
                StreamingMovies: formData.get("StreamingMovies"),
                Contract: formData.get("Contract"),
                PaperlessBilling: formData.get("PaperlessBilling"),
                PaymentMethod: formData.get("PaymentMethod"),
                MonthlyCharges: Number(formData.get("MonthlyCharges")),
                TotalCharges: Number(formData.get("TotalCharges"))
            };

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    const detail = result.detail;
                    throw new Error(
                        typeof detail === "string"
                            ? detail
                            : "Prediction failed. Please check the entered values."
                    );
                }

                const isChurn = Number(result.prediction) === 1;
                const probability = Number(result.churn_probability) * 100;

                document.getElementById("predictionText").textContent =
                    "Prediction: " + result.result;

                document.getElementById("probabilityText").textContent =
                    probability.toFixed(2) + "%";

                const answer = document.getElementById("answerText");
                answer.textContent = "Will Customer Churn: " +
                    (isChurn ? "YES" : "NO");
                answer.className = "answer-text " +
                    (isChurn ? "yes" : "no");

                resultBox.className = "result-card " +
                    (isChurn ? "churn" : "no-churn");
                resultBox.hidden = false;

            } catch (error) {
                errorBox.textContent = "Error: " + error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Predict Churn";
            }
        });
    </script>
</body>
</html>
