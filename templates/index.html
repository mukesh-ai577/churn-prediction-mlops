<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .result h2 {
            margin-bottom: 10px;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Customer Churn Prediction</h1>

    <p class="subtitle">
        Predict whether a customer is likely to churn
    </p>

    <form id="churnForm">

        <div class="form-grid">

            <div>
                <label>Gender</label>
                <select id="gender">
                    <option>Female</option>
                    <option>Male</option>
                </select>
            </div>

            <div>
                <label>Senior Citizen</label>
                <select id="SeniorCitizen">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div>
                <label>Partner</label>
                <select id="Partner">
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>

            <div>
                <label>Dependents</label>
                <select id="Dependents">
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>

            <div>
                <label>Tenure (months)</label>
                <input type="number" id="tenure" value="1">
            </div>

            <div>
                <label>Phone Service</label>
                <select id="PhoneService">
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>

            <div>
                <label>Multiple Lines</label>
                <select id="MultipleLines">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No phone service</option>
                </select>
            </div>

            <div>
                <label>Internet Service</label>
                <select id="InternetService">
                    <option>DSL</option>
                    <option>Fiber optic</option>
                    <option>No</option>
                </select>
            </div>

            <div>
                <label>Online Security</label>
                <select id="OnlineSecurity">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>
            </div>

            <div>
                <label>Online Backup</label>
                <select id="OnlineBackup">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>
            </div>

            <div>
                <label>Device Protection</label>
                <select id="DeviceProtection">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>
            </div>

            <div>
                <label>Tech Support</label>
                <select id="TechSupport">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>
            </div>

            <div>
                <label>Streaming TV</label>
                <select id="StreamingTV">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>
            </div>

            <div>
                <label>Streaming Movies</label>
                <select id="StreamingMovies">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>
            </div>

            <div>
                <label>Contract</label>
                <select id="Contract">
                    <option>Month-to-month</option>
                    <option>One year</option>
                    <option>Two year</option>
                </select>
            </div>

            <div>
                <label>Paperless Billing</label>
                <select id="PaperlessBilling">
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>

            <div>
                <label>Payment Method</label>
                <select id="PaymentMethod">
                    <option>Electronic check</option>
                    <option>Mailed check</option>
                    <option>Bank transfer (automatic)</option>
                    <option>Credit card (automatic)</option>
                </select>
            </div>

            <div>
                <label>Monthly Charges</label>
                <input type="number" step="0.01" id="MonthlyCharges" value="29.85">
            </div>

            <div>
                <label>Total Charges</label>
                <input type="number" step="0.01" id="TotalCharges" value="29.85">
            </div>

        </div>

        <button type="submit">Predict Churn</button>

    </form>

    <div class="result" id="result">
        <h2 id="prediction"></h2>
        <p id="probability"></p>
    </div>

</div>

<script>

document.getElementById("churnForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const data = {
        gender: document.getElementById("gender").value,
        SeniorCitizen: Number(document.getElementById("SeniorCitizen").value),
        Partner: document.getElementById("Partner").value,
        Dependents: document.getElementById("Dependents").value,
        tenure: Number(document.getElementById("tenure").value),
        PhoneService: document.getElementById("PhoneService").value,
        MultipleLines: document.getElementById("MultipleLines").value,
        InternetService: document.getElementById("InternetService").value,
        OnlineSecurity: document.getElementById("OnlineSecurity").value,
        OnlineBackup: document.getElementById("OnlineBackup").value,
        DeviceProtection: document.getElementById("DeviceProtection").value,
        TechSupport: document.getElementById("TechSupport").value,
        StreamingTV: document.getElementById("StreamingTV").value,
        StreamingMovies: document.getElementById("StreamingMovies").value,
        Contract: document.getElementById("Contract").value,
        PaperlessBilling: document.getElementById("PaperlessBilling").value,
        PaymentMethod: document.getElementById("PaymentMethod").value,
        MonthlyCharges: Number(document.getElementById("MonthlyCharges").value),
        TotalCharges: Number(document.getElementById("TotalCharges").value)
    };

    const response = await fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    document.getElementById("result").style.display = "block";

    document.getElementById("prediction").innerText =
        "Prediction: " + result.result;

    document.getElementById("probability").innerText =
        "Churn Probability: " + (result.churn_probability * 100).toFixed(2) + "%";

});

</script>

</body>
</html>
